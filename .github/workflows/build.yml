name: Build and test

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

jobs:
  # everything without a window (core, editor, MCP server) and its tests: on every system the app is to run on
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build src/PushPullMe.Editor -c Release
      - run: dotnet build src/PushPullMe.Mcp -c Release
      - run: dotnet test tests/PushPullMe.Tests -c Release

  # the window (WPF, Windows only for now)
  app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build src/PushPullMe -c Release
