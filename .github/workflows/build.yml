name: Build and test

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

jobs:
  # everything (the core, the editor layer, the MCP server, the window) and the tests, on every system it is to run on
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build src/PushPullMe -c Release
      - run: dotnet test tests/PushPullMe.Tests -c Release
