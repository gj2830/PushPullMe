name: Release

# a tag such as v0.5 makes a release with the app ready to run on Windows, Linux and macOS (no .NET needed): the
# window (src/PushPullMe) with the converter and the MCP server beside it
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64 }
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: macos-latest, rid: osx-arm64 }
          - { os: macos-latest, rid: osx-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test tests/PushPullMe.Tests -c Release
      - name: Publish
        shell: bash
        run: |
          dotnet publish src/PushPullMe -c Release -r ${{ matrix.rid }} --self-contained true -o publish
          # the MCP server on its own runtime as well (beside the app it would look for an installed .NET)
          dotnet publish src/PushPullMe.Mcp -c Release -r ${{ matrix.rid }} --self-contained true -o publish
          # (the Windows launcher of the MCP server comes along from the build: not on the other systems)
          if [ "${{ runner.os }}" != "Windows" ]; then rm -f publish/*.exe; fi
          rm -f publish/*.pdb
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath PushPullMe-${{ github.ref_name }}-${{ matrix.rid }}.zip
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mv publish PushPullMe
          tar -czf PushPullMe-${{ github.ref_name }}-${{ matrix.rid }}.tar.gz PushPullMe
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          app=PushPullMe.app
          mkdir -p $app/Contents/MacOS $app/Contents/Resources
          cp -R publish/. $app/Contents/MacOS/
          # the icon, from the PNG
          mkdir icon.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s src/PushPullMe.App/Assets/pushpullme.png --out icon.iconset/icon_${s}x${s}.png > /dev/null
            sips -z $((s*2)) $((s*2)) src/PushPullMe.App/Assets/pushpullme.png --out icon.iconset/icon_${s}x${s}@2x.png > /dev/null
          done
          iconutil -c icns icon.iconset -o $app/Contents/Resources/PushPullMe.icns
          cat > $app/Contents/Info.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>PushPullMe</string>
            <key>CFBundleDisplayName</key><string>PushPullMe</string>
            <key>CFBundleIdentifier</key><string>io.github.gj2830.pushpullme</string>
            <key>CFBundleVersion</key><string>${GITHUB_REF_NAME#v}</string>
            <key>CFBundleShortVersionString</key><string>${GITHUB_REF_NAME#v}</string>
            <key>CFBundleExecutable</key><string>PushPullMe</string>
            <key>CFBundleIconFile</key><string>PushPullMe</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          EOF
          # (not signed by Apple: signed for this machine only, so it starts after "Open" in its menu)
          codesign --force --deep --sign - $app
          ditto -c -k --keepParent $app PushPullMe-${{ github.ref_name }}-${{ matrix.rid }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          path: PushPullMe-${{ github.ref_name }}-${{ matrix.rid }}.*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: src
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        # what is new: docs/releases/<tag>.md, else the message of an annotated tag; GitHub's "Full Changelog" line below it
        run: |
          tag=${{ github.ref_name }}
          git -C src fetch --force origin "refs/tags/$tag:refs/tags/$tag"
          if [ -f "src/docs/releases/$tag.md" ]; then cp "src/docs/releases/$tag.md" notes.md
          elif [ "$(git -C src cat-file -t "$tag")" = tag ]; then git -C src tag -l --format='%(contents)' "$tag" > notes.md
          else : > notes.md; fi
          gh release create "$tag" PushPullMe-* --repo ${{ github.repository }} --title "PushPullMe $tag" --notes-file notes.md --generate-notes
